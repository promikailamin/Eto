name: Train Eto

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/train.yml'
      - 'data/**'
      - '!data/external/raw/**'
      - 'src/eto/**'
      - 'trainer.sh'
      - 'build.sh'
  workflow_dispatch:
    inputs:
      steps:
        description: Additional optimizer steps for this run
        required: true
        type: number
        default: 6000

permissions:
  contents: read

concurrency:
  group: eto-training-${{ github.ref }}
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download public conversation and story datasets (optional)
        run: python3 data/fetch_datasets.py || true

      - name: Prepare balanced training corpus
        run: python3 data/prepare_corpus.py --output .training/english_training.txt

      - name: Restore previous training checkpoint
        uses: actions/cache/restore@v4
        with:
          path: .training/checkpoint.bin
          key: eto-checkpoint-v4-${{ runner.os }}-${{ github.ref_name }}-ctx256-${{ hashFiles('.training/english_training.txt') }}-${{ github.run_id }}
          restore-keys: |
            eto-checkpoint-v4-${{ runner.os }}-${{ github.ref_name }}-ctx256-${{ hashFiles('.training/english_training.txt') }}-

      - name: Build and train
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .training
          resume_args=()
          if [[ -f .training/checkpoint.bin ]]; then
            resume_args+=(--resume .training/checkpoint.bin)
          fi
          ./build.sh
          ./trainer.sh \
            --data .training/english_training.txt \
            --out models/eto.gguf \
            --name Eto \
            --steps "${{ github.event_name == 'workflow_dispatch' && inputs.steps || 6000 }}" \
            --batch 4 \
            --ctx 256 \
            --dim 128 \
            --layers 4 \
            --heads 4 \
            --ffn 384 \
            --checkpoint .training/checkpoint.bin \
            --checkpoint-every 100 \
            "${resume_args[@]}"

      - name: Evaluate English and Minecraft outputs
        shell: bash
        run: |
          set -euo pipefail
          questions=(
            "hello"
            "how are you"
            "what is your name"
            "tell me a story"
            "i am sad"
            "what do you like to do"
            "can you help me"
            "what is a noun"
            "what is minecraft"
            "tell me a joke"
            "why is the sky blue"
            "good night"
          )
          for index in "${!questions[@]}"; do
            printf '\n[%02d/12] %s\n' "$((index + 1))" "${questions[index]}"
            ./runner.sh --model models/eto.gguf --prompt "${questions[index]}" --ctx 256 --tokens 96 --temp 0.5 --seed "$index"
          done

      - name: Save checkpoint for the next run
        if: always() && hashFiles('.training/checkpoint.bin') != ''
        uses: actions/cache/save@v4
        with:
          path: .training/checkpoint.bin
          key: eto-checkpoint-v4-${{ runner.os }}-${{ github.ref_name }}-ctx256-${{ hashFiles('.training/english_training.txt') }}-${{ github.run_id }}

      - name: Upload trained model
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eto-model
          path: models/eto.gguf
          if-no-files-found: error
          retention-days: 14